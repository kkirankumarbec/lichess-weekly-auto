name: Weekly Lichess Tournament

on:
  schedule:
    # Every Tuesday 02:30 UTC = 8:00 AM IST
    - cron: '30 2 * * 2'

  workflow_dispatch:

jobs:
  create-tournament:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create Lichess Tournament
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          python create_tournament.py
