name: Weekly Lichess Tournament

on:
  schedule:
    # Every Wednesday 10:15 UTC = 3:45 PM IST
    # (creates that same day's 8:15 PM IST tournament, ~4.5h before start)
    - cron: '15 10 * * 3'

  workflow_dispatch:
    inputs:
      start_ist:
        description: 'Optional: instant/custom tournament start, IST, format YYYY-MM-DD HH:MM (24h). Leave blank for the normal next-Wednesday 8:15 PM behaviour.'
        required: false
        default: ''
      code:
        description: 'Optional: custom tournament name/code (e.g. KCC-EXTRA1). Leave blank to auto-use the next KCCnn counter (only if left blank).'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  create-tournament:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create Lichess Tournament
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          CUSTOM_START_IST: ${{ github.event.inputs.start_ist }}
          CUSTOM_CODE: ${{ github.event.inputs.code }}
        run: |
          python create_tournament.py

      - name: Save updated counter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add counter.txt
          git diff --cached --quiet || git commit -m "Bump tournament counter"
          git push
