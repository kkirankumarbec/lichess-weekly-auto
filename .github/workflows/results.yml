name: Weekly Tournament Results

# After each weekly tournament finishes, fetch the final standings from
# Lichess, email the top 5 plus the running month-to-date season table, and
# update STANDINGS.md + results_log.json in the repo.
# Reads last_tournament.json (written by the Weekly workflow). Instant
# tournaments are not included.

on:
  schedule:
    # Wednesday 15:45 UTC = 9:15 PM IST - ~30 min after the 8:45 PM arena ends.
    # Results don't expire, so a late run here is harmless.
    - cron: '45 15 * * 3'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lichess-weekly-results
  cancel-in-progress: false

jobs:
  post-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Post results
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python post_results.py

      - name: Save results log and standings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results_log.json STANDINGS.md
          git diff --cached --quiet || git commit -m "Update results log and standings"
          git push
