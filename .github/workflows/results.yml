name: Weekly Tournament Results

on:
  schedule:
    - cron: '45 15 * * 3'
  workflow_dispatch:
    inputs:
      resend:
        description: 'Re-send current top 5 + month toppers without changing the log (yes/no)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: lichess-weekly-results
  cancel-in-progress: false

jobs:
  post-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Post results
        env:
          RESEND: ${{ github.event.inputs.resend }}
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python post_results.py

      - name: Save results log and standings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results_log.json STANDINGS.md
          git diff --cached --quiet || git commit -m "Update results log and standings"
          git push
