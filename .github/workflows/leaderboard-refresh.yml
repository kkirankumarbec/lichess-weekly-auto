name: Refresh Puzzle Leaderboard

# Reads the kids' puzzle submissions (a Google Sheet published as CSV,
# configured in config.json) and recomputes the leaderboard shown on the
# puzzle page. Runs every few hours, or any time on demand.

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: chess-puzzle-leaderboard
  cancel-in-progress: false

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests chess

      - name: Update leaderboard
        run: |
          python scripts/update_leaderboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/leaderboard.json
          git diff --cached --quiet || git commit -m "Refresh puzzle leaderboard"
          git push
