name: Weekly Lichess Tournament

on:
  schedule:
    - cron: '30 3 * * 3'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lichess-weekly-tournament
  cancel-in-progress: false

jobs:
  create-tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create Lichess Tournament
        env:
          MODE: weekly
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python create_tournament.py

      - name: Save updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add counter.txt last_tournament.json
          git diff --cached --quiet || git commit -m "Record weekly tournament"
          git push
