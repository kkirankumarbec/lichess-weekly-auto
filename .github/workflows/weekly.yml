name: Weekly Lichess Tournament

# Automatic weekly club tournament: Wednesday 8:15 PM IST, code KCC<counter>.
# The manual "Run workflow" button here does the SAME thing - use it only if a
# scheduled Wednesday run failed and you need to force this week's tournament.
# For a one-off tournament right now, use the separate "Instant Lichess
# Tournament" workflow instead.

on:
  schedule:
    # Every Wednesday 03:30 UTC = 9:00 AM IST - creates that same day's
    # 8:15 PM IST tournament, ~11h before start. GitHub's own "schedule"
    # trigger is best-effort and can run late (seen delays of 4+ hours on
    # this repo) - the large buffer here means a late-firing run still
    # lands well before the tournament, instead of the ~15 minutes of
    # notice a same-afternoon trigger would leave if it were delayed.
    - cron: '30 3 * * 3'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lichess-weekly-tournament
  cancel-in-progress: false

jobs:
  create-tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create Lichess Tournament
        env:
          MODE: weekly
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python create_tournament.py

      - name: Save updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add counter.txt last_tournament.json
          git diff --cached --quiet || git commit -m "Record weekly tournament"
          git push
